name: Fibonacci step (sequential)

on:
  workflow_dispatch:
    inputs:
      chain:
        description: 'Chain ID shared by all runs of one benchmark invocation'
        required: false
        default: ''
      n:
        description: 'Fibonacci index computed by this run'
        required: false
        default: '3'
      a:
        description: 'fib(n-2)'
        required: false
        default: '1'
      b:
        description: 'fib(n-1)'
        required: false
        default: '1'
      depth:
        description: 'Final fibonacci index to compute; the chain stops here'
        required: false
        default: '20'
      runs-on:
        description: 'Runner label for this job'
        required: false
        default: 'ubuntu-24.04'

permissions:
  actions: write

jobs:
  fib:
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Compute fib(n) and dispatch next run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          CHAIN: ${{ inputs.chain }}
          N: ${{ inputs.n }}
          A: ${{ inputs.a }}
          B: ${{ inputs.b }}
          DEPTH: ${{ inputs.depth }}
          RUNS_ON: ${{ inputs.runs-on }}
        run: |
          value=$((A + B))
          echo "fib($N) = $value"
          if [ "$N" -ge "$DEPTH" ]; then
            echo "$B $value" > result.txt
            echo "Done: fib($DEPTH) = $value"
            exit 0
          fi
          gh workflow run fibonacci.yml \
            --ref "$REF" \
            -f "chain=$CHAIN" \
            -f "n=$((N + 1))" \
            -f "a=$B" \
            -f "b=$value" \
            -f "depth=$DEPTH" \
            -f "runs-on=$RUNS_ON"

      - name: Publish final result
        if: ${{ inputs.chain != '' && inputs.n == inputs.depth }}
        uses: actions/upload-artifact@v4
        with:
          name: fib-${{ inputs.chain }}-${{ inputs.n }}
          path: result.txt
